server:
  port: 8600
  servlet:
    context-path: /proxy-client

spring:
  application:
    name: PROXY-CLIENT
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    discovery:
      enabled: true
  zipkin:
    base-url: ${SPRING_ZIPKIN_BASE_URL:http://localhost:9411/}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://service-discovery:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
server:
  port: 8300

spring:
  application:
    name: PRODUCT-SERVICE
  datasource:
    url: jdbc:h2:mem:ecommerce_dev_db;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        use_sql_comments: true
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://service-discovery:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    org:
      hibernate.SQL: DEBUG
      springframework.web: DEBUG
      springframework.data: DEBUG
      boot.autoconfigure.data.rest: DEBUG
      boot.autoconfigure.data.jpa: DEBUG
      boot.autoconfigure.orm: DEBUG

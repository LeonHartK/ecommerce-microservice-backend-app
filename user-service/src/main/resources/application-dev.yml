server:
  port: 8700

spring:
  application:
    name: USER-SERVICE
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:ecommerce}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://service-discovery:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    org:
      hibernate.SQL: DEBUG
      springframework.web: DEBUG
      springframework.data: DEBUG
      boot.autoconfigure.data.rest: DEBUG
      boot.autoconfigure.data.jpa: DEBUG
      boot.autoconfigure.orm: DEBUG
